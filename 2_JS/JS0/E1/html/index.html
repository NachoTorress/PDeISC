<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>Push() en JavaScript - Cards Horizontales</title>
</head>
<body>

<div class="app-container">

  <!-- Botón modo oscuro -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <!-- Card principal -->
  <div class="card shadow-lg main-card">

    <!-- Header -->
    <div class="card-header bg-primary text-white text-center py-3">
      <h1 class="h3 mb-0">Método push() en JavaScript</h1>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <!-- GRID -->
      <div class="row g-4">

        <!-- Card frutas -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-success">
              Frutas
            </h3>

            <div id="frutas" class="array-text"></div>

            <button
              class="btn btn-success mt-3 w-100"
              onclick="agregarFruta()"
            >
              Agregar fruta
            </button>

          </div>
        </div>

        <!-- Card amigos -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-primary">
              Amigos
            </h3>

            <div id="amigos" class="array-text"></div>

            <button
              class="btn btn-primary mt-3 w-100"
              onclick="agregarAmigo()"
            >
              Agregar amigo
            </button>

          </div>
        </div>

        <!-- Card números -->
        <div class="col-lg-4 col-md-12">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-warning">
              Números
            </h3>

            <div id="numeros" class="array-text"></div>

            <button
              class="btn btn-warning mt-3 w-100"
              onclick="agregarNumero()"
            >
              Generar número
            </button>

          </div>
        </div>

      </div>

      <!-- Resultado -->
      <div class="text-center mt-4 pt-4 border-top">
        <h5 id="resultadoNumero" class="text-muted">
          Número generado: -
        </h5>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>

  </div>

</div>

<script src="/scripts/script.js"></script>

</body>
</html>
