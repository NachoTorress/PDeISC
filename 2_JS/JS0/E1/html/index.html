<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Push() en JavaScript - Formato Full Width</title>
</head>
<body>

<div class="app-container">
  <div class="card shadow-lg main-card">
    <div class="card-header bg-primary text-white text-center py-3">
      <h1 class="h3 mb-0">Método push() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="d-flex flex-column gap-4">
        
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-success">Frutas</h3>
          <div id="frutas" class="array-text"></div>
          <button class="btn btn-success mt-2" onclick="agregarFruta()">
            Agregar fruta
          </button>
        </div>

        <hr>

        <div class="exercise-row">
          <h3 class="h5 fw-bold text-primary">Amigos</h3>
          <div id="amigos" class="array-text"></div>
          <button class="btn btn-primary mt-2" onclick="agregarAmigo()">
            Agregar amigo
          </button>
        </div>

        <hr>

        <div class="exercise-row">
          <h3 class="h5 fw-bold text-warning">Números</h3>
          <div id="numeros" class="array-text"></div>
          <button class="btn btn-warning mt-2" onclick="agregarNumero()">
            Generar número
          </button>
        </div>

      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <h5 id="resultadoNumero" class="text-muted">Número generado: -</h5>
      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
