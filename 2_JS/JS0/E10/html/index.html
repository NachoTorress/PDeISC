<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">

  <title>map() range final</title>
</head>

<body>

<div class="app-container">

  <!-- BOTÓN MODO OSCURO -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <div class="card shadow-lg main-card">

    <div class="card-header bg-info text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método map() con range
      </h1>
    </div>

    <div class="card-body p-4">

      <!-- FILA HORIZONTAL -->
      <div class="activities-row">

        <!-- NUMEROS -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold text-primary">
            Números x3
          </h3>

          <div id="numeros" class="array-text"></div>

          <p id="txtNum" class="mt-2 text-muted">
            Cambiá el valor del rango para ejecutar la acción
          </p>

          <input
            id="rangeNum"
            type="range"
            min="1"
            max="10"
            value="1"
            class="form-range mt-2"
          >

          <div id="resNumero" class="resultado-map mt-2"></div>

        </div>

        <!-- NOMBRES -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold text-success">
            Mayúsculas
          </h3>

          <div id="nombres" class="array-text"></div>

          <p id="txtNom" class="mt-2 text-muted">
            Cambiá el valor del rango para ejecutar la acción
          </p>

          <input
            id="rangeNombre"
            type="range"
            min="1"
            max="10"
            value="1"
            class="form-range mt-2"
          >

          <div id="resNombre" class="resultado-map mt-2"></div>

        </div>

        <!-- PRECIOS -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold text-warning">
            Precios + IVA (21%)
          </h3>

          <div id="precios" class="array-text"></div>

          <p id="txtPre" class="mt-2 text-muted">
            Cambiá el valor del rango para ejecutar la acción
          </p>

          <input
            id="rangePrecio"
            type="range"
            min="1"
            max="10"
            value="1"
            class="form-range mt-2"
          >

          <div id="resPrecio" class="resultado-map mt-2"></div>

        </div>

      </div>

    </div>

    <div class="card-footer text-center text-muted small">
      Transformación de Arrays con map()
    </div>

  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
