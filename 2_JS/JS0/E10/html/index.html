<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>map() range final</title>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3">

<div class="container" style="max-width: 900px;">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-info text-white text-center py-3">
      <h1 class="h3 mb-0">Método map() con range (Ejecución única)</h1>
    </div>

    <div class="card-body p-4">
      <div class="row g-4">

        <!-- NUMEROS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-primary">Números x3</h3>
            <div id="numeros" class="array-text"></div>
            <p id="txtNum" class="mt-2 text-muted">
              Cambiá el valor del rango para ejecutar la acción
            </p>
            <input id="rangeNum" type="range" min="1" max="10" value="1" class="form-range mt-2">
            <div id="resNumero" class="resultado-map mt-2"></div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- NOMBRES -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-success">Mayúsculas</h3>
            <div id="nombres" class="array-text"></div>
            <p id="txtNom" class="mt-2 text-muted">
              Cambiá el valor del rango para ejecutar la acción
            </p>
            <input id="rangeNombre" type="range" min="1" max="10" value="1" class="form-range mt-2">
            <div id="resNombre" class="resultado-map mt-2"></div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- PRECIOS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-warning">Precios + IVA (21%)</h3>
            <div id="precios" class="array-text"></div>
            <p id="txtPre" class="mt-2 text-muted">
              Cambiá el valor del rango para ejecutar la acción
            </p>
            <input id="rangePrecio" type="range" min="1" max="10" value="1" class="form-range mt-2">
            <div id="resPrecio" class="resultado-map mt-2"></div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Transformación de Arrays con map()
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
