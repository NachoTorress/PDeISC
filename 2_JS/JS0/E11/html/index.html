<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Método filter()</title>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3">

<div class="container" style="max-width: 900px;">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-success text-white text-center py-3">
      <h1 class="h3 mb-0">Método filter() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="row g-4">

        <!-- NUMEROS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-primary">Números > 10</h3>
            <div id="numeros" class="array-text"></div>
            <button id="btnNum" class="btn btn-primary w-100 mt-3">
              Filtrar números
            </button>
            <div id="resNum" class="resultado-filter mt-2">Acción: -</div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- PALABRAS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-success">Palabras > 5 letras</h3>
            <div id="palabras" class="array-text"></div>
            <button id="btnPal" class="btn btn-success w-100 mt-3">
              Filtrar palabras
            </button>
            <div id="resPal" class="resultado-filter mt-2">Acción: -</div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- USUARIOS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-warning">Usuarios activos</h3>
            <div id="usuarios" class="array-text"></div>
            <button id="btnUsu" class="btn btn-warning w-100 mt-3">
              Filtrar usuarios
            </button>
            <div id="resUsu" class="resultado-filter mt-2">Acción: -</div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Filtrado de datos en Arrays con filter()
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
