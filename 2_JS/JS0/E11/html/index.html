<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">

  <title>Método filter()</title>
</head>

<body>

<div class="app-container">

  <!-- BOTON TEMA -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <div class="card shadow-lg main-card">

    <div class="card-header bg-success text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método filter() en JavaScript
      </h1>
    </div>

    <div class="card-body p-4">

      <!-- FILA HORIZONTAL -->
      <div class="activities-row">

        <!-- NUMEROS -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold title-numeros">
            Números > 10
          </h3>

          <div id="numeros" class="array-text"></div>

          <button
            id="btnNum"
            class="btn btn-primary w-100 mt-3"
          >
            Filtrar números
          </button>

          <div id="resNum" class="resultado-filter mt-2">
            Acción: -
          </div>

        </div>

        <!-- PALABRAS -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold title-palabras">
            Palabras > 5 letras
          </h3>

          <div id="palabras" class="array-text"></div>

          <button
            id="btnPal"
            class="btn btn-success w-100 mt-3"
          >
            Filtrar palabras
          </button>

          <div id="resPal" class="resultado-filter mt-2">
            Acción: -
          </div>

        </div>

        <!-- USUARIOS -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold title-usuarios">
            Usuarios activos
          </h3>

          <div id="usuarios" class="array-text"></div>

          <button
            id="btnUsu"
            class="btn btn-warning w-100 mt-3"
          >
            Filtrar usuarios
          </button>

          <div id="resUsu" class="resultado-filter mt-2">
            Acción: -
          </div>

        </div>

      </div>

    </div>

    <div class="card-footer text-center text-muted small">
      Filtrado de datos en Arrays con filter()
    </div>

  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
