<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Método reduce()</title>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3">

<div class="container" style="max-width: 900px;">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">Método reduce() en JavaScript</h1>
      <p class="small mb-0 mt-1 text-info">⚠️ Doble click en los botones para ejecutar</p>
    </div>

    <div class="card-body p-4">
      <div class="row g-4">

        <!-- SUMA -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-primary">Suma Total</h3>
            <div id="suma" class="array-text"></div>
            <button id="btnSuma" class="btn btn-primary w-100 mt-3">Calcular suma</button>
            <div id="resSuma" class="resultado-reduce mt-2">Acción: -</div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- MULTIPLICACION -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-success">Multiplicación Total</h3>
            <div id="mult" class="array-text"></div>
            <button id="btnMult" class="btn btn-success w-100 mt-3">Calcular producto</button>
            <div id="resMult" class="resultado-reduce mt-2">Acción: -</div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- OBJETOS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-warning">Total Precios (Objetos)</h3>
            <div id="precios" class="array-text"></div>
            <button id="btnPrecios" class="btn btn-warning w-100 mt-3">Calcular total</button>
            <div id="resPrecios" class="resultado-reduce mt-2">Acción: -</div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Acumulación de datos con reduce()
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
