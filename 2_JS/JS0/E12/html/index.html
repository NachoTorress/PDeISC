<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">

  <title>Método reduce()</title>
</head>

<body>

<div class="app-container">

  <!-- BOTON TEMA -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <div class="card shadow-lg main-card">

    <div class="card-header bg-dark text-white text-center py-3">

      <h1 class="h3 mb-0">
        Método reduce() en JavaScript
      </h1>

      <p class="small mb-0 mt-1 text-info">
        ⚠️ Doble click en los botones para ejecutar
      </p>

    </div>

    <div class="card-body p-4">

      <!-- FILA HORIZONTAL -->
      <div class="activities-row">

        <!-- SUMA -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold title-suma">
            Suma Total
          </h3>

          <div id="suma" class="array-text"></div>

          <button
            id="btnSuma"
            class="btn btn-primary w-100 mt-3"
          >
            Calcular suma
          </button>

          <div id="resSuma" class="resultado-reduce mt-2">
            Acción: -
          </div>

        </div>

        <!-- MULTIPLICACION -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold title-mult">
            Multiplicación Total
          </h3>

          <div id="mult" class="array-text"></div>

          <button
            id="btnMult"
            class="btn btn-success w-100 mt-3"
          >
            Calcular producto
          </button>

          <div id="resMult" class="resultado-reduce mt-2">
            Acción: -
          </div>

        </div>

        <!-- OBJETOS -->
        <div class="exercise-col">

          <h3 class="h5 fw-bold title-precios">
            Total Precios
          </h3>

          <div id="precios" class="array-text"></div>

          <button
            id="btnPrecios"
            class="btn btn-warning w-100 mt-3"
          >
            Calcular total
          </button>

          <div id="resPrecios" class="resultado-reduce mt-2">
            Acción: -
          </div>

        </div>

      </div>

    </div>

    <div class="card-footer text-center text-muted small">
      Acumulación de datos con reduce()
    </div>

  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
