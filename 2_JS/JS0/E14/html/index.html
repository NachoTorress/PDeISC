<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Método reverse()</title>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3">

<div class="container" style="max-width: 900px;">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">Método reverse() - Inversión de Datos</h1>
      <p class="small mb-0 mt-1 text-info">Presioná el botón para invertir el orden de los elementos</p>
    </div>

    <div class="card-body p-4">
      <div class="row g-4">

        <!-- LETRAS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-primary">Array de Letras</h3>
            <div id="letras" class="array-text mb-3"></div>
            
            <div id="wrapperLet">
              <label class="form-label small fw-bold text-secondary">ACCIÓN: Invertir posiciones [A -> E]</label>
              <button id="btnLet" class="btn btn-primary w-100">Ejecutar: Invertir Letras</button>
            </div>
            
            <div id="resLet" class="resultado-reverse mt-2">Estado: Original</div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- NUMEROS -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-success">Array de Números</h3>
            <div id="numeros" class="array-text mb-3"></div>
            
            <div id="wrapperNum">
              <label class="form-label small fw-bold text-secondary">ACCIÓN: Invertir secuencia numérica</label>
              <button id="btnNum" class="btn btn-success w-100">Ejecutar: Invertir Números</button>
            </div>

            <div id="resNum" class="resultado-reverse mt-2">Estado: Original</div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- TEXTO -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-warning">Cadena de Texto (String)</h3>
            <div id="texto" class="array-text mb-3">JavaScript</div>
            
            <div id="wrapperTxt">
              <label class="form-label small fw-bold text-secondary">ACCIÓN: split() + reverse() + join()</label>
              <button id="btnTxt" class="btn btn-warning w-100">Ejecutar: Invertir Texto</button>
            </div>

            <div id="resTxt" class="resultado-reverse mt-2">Estado: Original</div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      reverse() muta el array original, por lo que usamos el operador spread [...]
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
