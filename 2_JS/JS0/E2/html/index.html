<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Pop() en JavaScript - Formato Full Width</title>
</head>
<body>

<div class="app-container">
  <div class="card shadow-lg main-card">
    <div class="card-header bg-danger text-white text-center py-3">
      <h1 class="h3 mb-0">Método pop() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="d-flex flex-column gap-4">
        
        <!-- Animales -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-danger">Animales</h3>
          <div id="animales" class="array-text"></div>
          <button id="btnAnimal" class="btn btn-danger mt-2">
            Doble toque para eliminar último animal
          </button>
        </div>

        <hr>

        <!-- Lista de compras -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-warning">Lista de compras</h3>
          <div id="compras" class="array-text"></div>
          <button id="btnCompra" class="btn btn-warning mt-2">
            Doble toque para eliminar último producto
          </button>
        </div>

        <hr>

        <!-- Vaciar números -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-primary">Números</h3>
          <div id="numeros" class="array-text"></div>
          <button id="btnNumero" class="btn btn-primary mt-2">
            Doble toque para vaciar array
          </button>
        </div>

      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <h5 id="resultado" class="text-muted">Elemento eliminado: -</h5>
      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
