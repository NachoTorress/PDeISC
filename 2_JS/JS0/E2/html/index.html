<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>Pop() en JavaScript - Cards Horizontales</title>
</head>
<body>

<div class="app-container">

  <!-- Botón tema -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <!-- Card principal -->
  <div class="card shadow-lg main-card">

    <!-- Header -->
    <div class="card-header bg-danger text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método pop() en JavaScript
      </h1>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <!-- Grid -->
      <div class="row g-4">

        <!-- Card animales -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-danger">
              Animales
            </h3>

            <div id="animales" class="array-text"></div>

            <button
              id="btnAnimal"
              class="btn btn-danger mt-3 w-100"
            >
              Doble toque para eliminar último animal
            </button>

          </div>
        </div>

        <!-- Card compras -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-warning">
              Lista de compras
            </h3>

            <div id="compras" class="array-text"></div>

            <button
              id="btnCompra"
              class="btn btn-warning mt-3 w-100"
            >
              Doble toque para eliminar último producto
            </button>

          </div>
        </div>

        <!-- Card números -->
        <div class="col-lg-4 col-md-12">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-primary">
              Números
            </h3>

            <div id="numeros" class="array-text"></div>

            <button
              id="btnNumero"
              class="btn btn-primary mt-3 w-100"
            >
              Doble toque para vaciar array
            </button>

          </div>
        </div>

      </div>

      <!-- Resultado -->
      <div class="text-center mt-4 pt-4 border-top">
        <h5 id="resultado" class="text-muted">
          Elemento eliminado: -
        </h5>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>

  </div>

</div>

<script src="/scripts/script.js"></script>

</body>
</html>
