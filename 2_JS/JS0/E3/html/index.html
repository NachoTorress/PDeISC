<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>Unshift() en JavaScript - Cards Horizontales</title>
</head>
<body>

<div class="app-container">

  <!-- Botón modo oscuro -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <!-- Card principal -->
  <div class="card shadow-lg main-card">

    <!-- Header -->
    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método unshift() en JavaScript
      </h1>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <!-- Grid -->
      <div class="row g-4">

        <!-- Card colores -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-secondary">
              Colores
            </h3>

            <div id="colores" class="array-text"></div>

            <select
              id="selectColor"
              class="form-select mt-3"
              onchange="agregarColor()"
            >
              <option value="">
                Seleccionar color para el inicio
              </option>

              <option value="Rojo">Rojo</option>
              <option value="Verde">Verde</option>
              <option value="Azul">Azul</option>
            </select>

          </div>
        </div>

        <!-- Card tareas -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-secondary">
              Tareas
            </h3>

            <div id="tareas" class="array-text"></div>

            <select
              id="selectTarea"
              class="form-select mt-3"
              onchange="agregarTarea()"
            >
              <option value="">
                Agregar tarea urgente (inicio)
              </option>

              <option value="Tarea urgente para mañana">
                Tarea urgente para mañana
              </option>
            </select>

          </div>
        </div>

        <!-- Card usuarios -->
        <div class="col-lg-4 col-md-12">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-secondary">
              Usuarios conectados
            </h3>

            <div id="usuarios" class="array-text"></div>

            <select
              id="selectUsuario"
              class="form-select mt-3"
              onchange="agregarUsuario()"
            >
              <option value="">
                Agregar usuario al principio
              </option>

              <option value="Alexis">Alexis</option>
            </select>

          </div>
        </div>

      </div>

      <!-- Resultado -->
      <div class="text-center mt-4 pt-4 border-top">
        <h5 id="resultado" class="text-muted">
          Último agregado: -
        </h5>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>

  </div>

</div>

<script src="/scripts/script.js"></script>

</body>
</html>
