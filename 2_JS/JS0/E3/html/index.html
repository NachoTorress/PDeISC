<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Unshift() en JavaScript - Formato Full Width</title>
</head>
<body>

<div class="app-container">
  <div class="card shadow-lg main-card">
    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">Método unshift() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="d-flex flex-column gap-4">
        
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-secondary">Colores</h3>
          <div id="colores" class="array-text"></div>
          <select id="selectColor" class="form-select mt-2" onchange="agregarColor()">
            <option value="">Seleccionar color para el inicio</option>
            <option value="Rojo">Rojo</option>
            <option value="Verde">Verde</option>
            <option value="Azul">Azul</option>
          </select>
        </div>

        <hr>

        <div class="exercise-row">
          <h3 class="h5 fw-bold text-secondary">Tareas</h3>
          <div id="tareas" class="array-text"></div>
          <select id="selectTarea" class="form-select mt-2" onchange="agregarTarea()">
            <option value="">Agregar tarea urgente (inicio)</option>
            <option value="Tarea urgente para mañana">Tarea urgente para mañana</option>
          </select>
        </div>

        <hr>

        <div class="exercise-row">
          <h3 class="h5 fw-bold text-secondary">Usuarios conectados</h3>
          <div id="usuarios" class="array-text"></div>
          <select id="selectUsuario" class="form-select mt-2" onchange="agregarUsuario()">
            <option value="">Agregar usuario al principio</option>
            <option value="Alexis">Alexis</option>
          </select>
        </div>

      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <h5 id="resultado" class="text-muted">Último agregado: -</h5>
      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
