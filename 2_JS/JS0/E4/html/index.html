<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Shift() en JavaScript - Formato Full Width</title>
</head>
<body>

<div class="app-container">
  <div class="card shadow-lg main-card">
    <div class="card-header bg-info text-white text-center py-3">
      <h1 class="h3 mb-0">Método shift() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="d-flex flex-column gap-4">
        
        <!-- Enteros -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-info">Enteros</h3>
          <div id="enteros" class="array-text"></div>
          <input type="range" min="0" max="1" value="0" class="form-range mt-2" id="rangoEnteros" onchange="eliminarEntero()">
          <p class="text-muted small mb-0" id="textoEnteros">Deslizá para eliminar el primero</p>
        </div>

        <hr>

        <!-- Mensajes -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-info">Mensajes</h3>
          <div id="mensajes" class="array-text"></div>
          <input type="range" min="0" max="1" value="0" class="form-range mt-2" id="rangoMensajes" onchange="eliminarMensaje()">
          <p class="text-muted small mb-0" id="textoMensajes">Deslizá para eliminar el primero</p>
        </div>

        <hr>

        <!-- Cola -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-info">Cola de atención</h3>
          <div id="cola" class="array-text"></div>
          <input type="range" min="0" max="1" value="0" class="form-range mt-2" id="rangoCola" onchange="atenderCliente()">
          <p class="text-muted small mb-0" id="textoCola">Deslizá para atender al primero</p>
        </div>

      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <h5 id="resultado" class="text-muted">Elemento eliminado: -</h5>
      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
