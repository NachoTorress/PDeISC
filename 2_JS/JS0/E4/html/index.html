<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>Shift() en JavaScript - Cards Horizontales</title>
</head>
<body>

<div class="app-container">

  <!-- Botón tema -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <!-- Card principal -->
  <div class="card shadow-lg main-card">

    <!-- Header -->
    <div class="card-header bg-info text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método shift() en JavaScript
      </h1>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <div class="row g-4">

        <!-- Enteros -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-info">
              Enteros
            </h3>

            <div id="enteros" class="array-text"></div>

            <input
              type="range"
              min="0"
              max="1"
              value="0"
              class="form-range mt-3"
              id="rangoEnteros"
              onchange="eliminarEntero()"
            >

            <p
              class="text-muted small mb-0"
              id="textoEnteros"
            >
              Deslizá para eliminar el primero
            </p>

          </div>
        </div>

        <!-- Mensajes -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-info">
              Mensajes
            </h3>

            <div id="mensajes" class="array-text"></div>

            <input
              type="range"
              min="0"
              max="1"
              value="0"
              class="form-range mt-3"
              id="rangoMensajes"
              onchange="eliminarMensaje()"
            >

            <p
              class="text-muted small mb-0"
              id="textoMensajes"
            >
              Deslizá para eliminar el primero
            </p>

          </div>
        </div>

        <!-- Cola -->
        <div class="col-lg-4 col-md-12">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-info">
              Cola de atención
            </h3>

            <div id="cola" class="array-text"></div>

            <input
              type="range"
              min="0"
              max="1"
              value="0"
              class="form-range mt-3"
              id="rangoCola"
              onchange="atenderCliente()"
            >

            <p
              class="text-muted small mb-0"
              id="textoCola"
            >
              Deslizá para atender al primero
            </p>

          </div>
        </div>

      </div>

      <!-- Resultado -->
      <div class="text-center mt-4 pt-4 border-top">
        <h5 id="resultado" class="text-muted">
          Elemento eliminado: -
        </h5>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>

  </div>

</div>

<script src="/scripts/script.js"></script>

</body>
</html>
