<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Splice() en JavaScript - Formato Full Width</title>
</head>
<body>

<div class="app-container">
  <div class="card shadow-lg main-card">
    <div class="card-header bg-primary text-white text-center py-3">
      <h1 class="h3 mb-0">Método splice() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="d-flex flex-column gap-4">
        
        <!-- LETRAS -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-danger">Letras</h3>
          <div id="letras" class="array-text"></div>
          <button id="btnLetras" class="btn btn-danger mt-2">
            Eliminar 2 elementos desde posición 1
          </button>
        </div>

        <hr>

        <!-- NOMBRES -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-warning">Nombres</h3>
          <div id="nombres" class="array-text"></div>
          <button id="btnNombres" class="btn btn-warning mt-2">
            Insertar "Nacho" en posición 2
          </button>
        </div>

        <hr>

        <!-- COSAS -->
        <div class="exercise-row" id="containerCosas">
          <h3 class="h5 fw-bold text-primary">Cosas</h3>
          <div id="cosas" class="array-text"></div>
          
          <div id="inputsCosas" class="mt-2">
            <div class="row g-2">
              <div class="col-4">
                <input id="pos" type="number" class="form-control" placeholder="Posición">
              </div>
              <div class="col-4">
                <input id="n1" class="form-control" placeholder="Nuevo 1">
              </div>
              <div class="col-4">
                <input id="n2" class="form-control" placeholder="Nuevo 2">
              </div>
            </div>
            <button id="btnCosas" class="btn btn-primary w-100 mt-2">
              Reemplazar dinámico
            </button>
            <small id="errorMsg" class="text-danger d-none">Posición fuera de rango</small>
          </div>
        </div>

      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <h5 id="resultado" class="text-muted">Acción: -</h5>
      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
