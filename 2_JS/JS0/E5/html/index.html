<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>splice() en JavaScript - Cards Horizontales</title>
</head>
<body>

<div class="app-container">

  <!-- Botón tema -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <!-- Card principal -->
  <div class="card shadow-lg main-card">

    <!-- Header -->
    <div class="card-header bg-primary text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método splice() en JavaScript
      </h1>
    </div>

    <!-- Body -->
    <div class="card-body p-4">

      <div class="row g-4">

        <!-- Letras -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-danger">
              Letras
            </h3>

            <div id="letras" class="array-text"></div>

            <button
              id="btnLetras"
              class="btn btn-danger w-100 mt-3"
            >
              Eliminar 2 elementos desde posición 1
            </button>

          </div>
        </div>

        <!-- Nombres -->
        <div class="col-lg-4 col-md-6">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-warning">
              Nombres
            </h3>

            <div id="nombres" class="array-text"></div>

            <button
              id="btnNombres"
              class="btn btn-warning w-100 mt-3"
            >
              Insertar "Nacho" en posición 2
            </button>

          </div>
        </div>

        <!-- Cosas -->
        <div class="col-lg-4 col-md-12">
          <div class="mini-card h-100">

            <h3 class="h5 fw-bold text-primary">
              Cosas
            </h3>

            <div id="cosas" class="array-text"></div>

            <div id="inputsCosas" class="mt-3">

              <div class="row g-2">

                <div class="col-12">
                  <input
                    id="pos"
                    type="number"
                    class="form-control"
                    placeholder="Posición de los nuevos elementos"
                  >
                </div>

                <div class="col-6">
                  <input
                    id="n1"
                    class="form-control"
                    placeholder="Nuevo elemento 1"
                  >
                </div>

                <div class="col-6">
                  <input
                    id="n2"
                    class="form-control"
                    placeholder="Nuevo elemento 2"
                  >
                </div>

              </div>

              <button
                id="btnCosas"
                class="btn btn-primary w-100 mt-3"
              >
                Reemplazar dinámico
              </button>

              <small
                id="errorMsg"
                class="text-danger d-none"
              >
                Posición fuera de rango
              </small>

            </div>

          </div>
        </div>

      </div>

      <!-- Resultado -->
      <div class="text-center mt-4 pt-4 border-top">
        <h5 id="resultado" class="text-muted">
          Acción: -
        </h5>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos
    </div>

  </div>

</div>

<script src="/scripts/script.js"></script>

</body>
</html>
