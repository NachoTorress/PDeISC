<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Slice() en JavaScript - Formato Full Width</title>
</head>
<body>

<div class="app-container">
  <div class="card shadow-lg main-card">
    <div class="card-header bg-success text-white text-center py-3">
      <h1 class="h3 mb-0">Método slice() en JavaScript</h1>
    </div>

    <div class="card-body p-4">
      <div class="d-flex flex-column gap-4">
        
        <!-- Números -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-primary">Números</h3>
          <div id="numeros" class="array-text"></div>
          <button id="btnNumeros" class="btn btn-primary mt-2">
            Doble click: copiar primeros 3
          </button>
          <div id="resNumeros" class="mt-2"></div>
        </div>

        <hr>

        <!-- Películas -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-warning">Películas</h3>
          <div id="peliculas" class="array-text"></div>
          <button id="btnPeliculas" class="btn btn-warning mt-2">
            Doble click: copiar posición 2 a 4
          </button>
          <div id="resPeliculas" class="mt-2"></div>
        </div>

        <hr>

        <!-- Últimos -->
        <div class="exercise-row">
          <h3 class="h5 fw-bold text-success">Últimos datos</h3>
          <div id="ultimos" class="array-text"></div>
          <button id="btnUltimos" class="btn btn-success mt-2">
            Doble click: copiar últimos 3
          </button>
          <div id="resUltimos" class="mt-2"></div>
        </div>

      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Visualización de Estructuras de Datos - Copia de Arrays
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
