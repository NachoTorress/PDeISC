<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>Método indexOf() - Selects Interactivos</title>
</head>
<body>

<div class="app-container">

  <!-- Botón modo oscuro -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <div class="card shadow-lg main-card">

    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">Método indexOf() en JavaScript</h1>
    </div>

    <div class="card-body p-4">

      <!-- GRID -->
      <div class="row g-4">

        <!-- ANIMALES -->
        <div class="col-lg-4">
          <div class="exercise-card h-100">

            <h3 class="h5 fw-bold text-primary">
              Animales
            </h3>

            <div id="animales" class="array-text"></div>

            <select id="selectAnimales" class="form-select mt-3">
              <option value="" selected disabled>
                Seleccioná un animal...
              </option>
            </select>

            <div id="resPerro" class="resultado-busqueda mt-3">
              Esperando selección
            </div>

          </div>
        </div>

        <!-- NUMEROS -->
        <div class="col-lg-4">
          <div class="exercise-card h-100">

            <h3 class="h5 fw-bold text-danger">
              Números
            </h3>

            <div id="numeros" class="array-text"></div>

            <select id="selectNumero" class="form-select mt-3">
              <option value="" selected disabled>
                Seleccioná un número...
              </option>
            </select>

            <div id="resNumero" class="resultado-busqueda mt-3">
              Esperando selección
            </div>

          </div>
        </div>

        <!-- CIUDADES -->
        <div class="col-lg-4">
          <div class="exercise-card h-100">

            <h3 class="h5 fw-bold text-success">
              Ciudades
            </h3>

            <div id="ciudades" class="array-text"></div>

            <select id="selectCiudades" class="form-select mt-3">
              <option value="" selected disabled>
                Seleccioná una ciudad...
              </option>
            </select>

            <div id="resCiudad" class="resultado-busqueda mt-3">
              Esperando selección
            </div>

          </div>
        </div>

      </div>

    </div>

    <div class="card-footer text-center text-muted small">
      Búsqueda de Índices por Selección Directa
    </div>

  </div>
</div>

<script src="/scripts/script.js"></script>

</body>
</html>
