<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/styles/style.css">

  <title>Método includes() - Verificación Dinámica</title>
</head>
<body>

<div class="app-container">

  <!-- Botón modo oscuro -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <div class="card shadow-lg main-card">

    <div class="card-header bg-primary text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método includes() en JavaScript
      </h1>
    </div>

    <div class="card-body p-4">

      <div class="row g-4">

        <!-- USUARIOS -->
        <div class="col-lg-4">
          <div class="exercise-card h-100">

            <h3 class="h5 fw-bold text-primary">
              Usuarios
            </h3>

            <div id="usuarios" class="array-text"></div>

            <select id="selectUsuarios" class="form-select mt-3">
              <option value="" selected disabled>
                ¿Está el usuario en la lista?
              </option>
            </select>

            <div id="resAdmin" class="resultado-verificacion mt-3">
              Esperando selección...
            </div>

          </div>
        </div>

        <!-- COLORES -->
        <div class="col-lg-4">
          <div class="exercise-card h-100">

            <h3 class="h5 fw-bold text-success">
              Colores
            </h3>

            <div id="colores" class="array-text"></div>

            <select id="selectColores" class="form-select mt-3">
              <option value="" selected disabled>
                ¿Está el color en la lista?
              </option>
            </select>

            <div id="resColor" class="resultado-verificacion mt-3">
              Esperando selección...
            </div>

          </div>
        </div>

        <!-- NUMEROS -->
        <div class="col-lg-4">
          <div class="exercise-card h-100">

            <h3 class="h5 fw-bold text-warning">
              Números
            </h3>

            <div id="numeros" class="array-text"></div>

            <select id="selectNumeros" class="form-select mt-3">
              <option value="" selected disabled>
                ¿Está el número en la lista?
              </option>
            </select>

            <div id="resNumero" class="resultado-verificacion mt-3">
              Esperando selección...
            </div>

          </div>
        </div>

      </div>

    </div>

    <div class="card-footer text-center text-muted small">
      Verificación booleana de existencia en Arrays
    </div>

  </div>
</div>

<script src="/scripts/script.js"></script>

</body>
</html>
