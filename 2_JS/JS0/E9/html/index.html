<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">

  <title>forEach() limpio</title>
</head>

<body>

<div class="app-container">

  <!-- BOTÓN MODO OSCURO -->
  <div class="theme-toggle-container">
    <button id="themeToggle" class="btn btn-dark">
      🌙 Modo oscuro
    </button>
  </div>

  <div class="card shadow-lg main-card">

    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">
        Método forEach() - Formato Horizontal
      </h1>
    </div>

    <div class="card-body p-4">

      <!-- FILA HORIZONTAL -->
      <div class="activities-row">

        <!-- NOMBRES -->
        <div class="exercise-col">
          <h3 class="h5 fw-bold text-primary">
            Nombres
          </h3>

          <div id="nombres" class="array-text"></div>

          <button id="btnNombres" class="btn btn-primary w-100 mt-2">
            Doble click: Saludar
          </button>

          <div id="resNombres" class="resultado-iteracion mt-2"></div>
        </div>

        <!-- NUMEROS -->
        <div class="exercise-col">
          <h3 class="h5 fw-bold text-success">
            Números
          </h3>

          <div id="numeros" class="array-text"></div>

          <button id="btnNumeros" class="btn btn-success w-100 mt-2">
            Doble click: Doblar
          </button>

          <div id="resNumeros" class="resultado-iteracion mt-2"></div>
        </div>

        <!-- PERSONAS -->
        <div class="exercise-col">
          <h3 class="h5 fw-bold text-warning">
            Personas
          </h3>

          <div id="personas" class="array-text"></div>

          <button id="btnPersonas" class="btn btn-warning w-100 mt-2">
            Doble click: Mostrar
          </button>

          <div id="resPersonas" class="resultado-iteracion mt-2"></div>
        </div>

      </div>

    </div>

    <div class="card-footer text-center text-muted small">
      Iteración de Arrays con forEach()
    </div>

  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
