<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/style.css">
  <title>forEach() limpio</title>
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3">

<div class="container" style="max-width: 900px;">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-dark text-white text-center py-3">
      <h1 class="h3 mb-0">Método forEach() - Formato Limpio</h1>
    </div>

    <div class="card-body p-4">
      <div class="row g-4">

        <!-- Nombres -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-primary">Nombres</h3>
            <div id="nombres" class="array-text"></div>
            <button id="btnNombres" class="btn btn-primary w-100 mt-2">
              Doble click: Saludar
            </button>
            <div id="resNombres" class="resultado-iteracion mt-2"></div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- Números -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-success">Números</h3>
            <div id="numeros" class="array-text"></div>
            <button id="btnNumeros" class="btn btn-success w-100 mt-2">
              Doble click: Doblar
            </button>
            <div id="resNumeros" class="resultado-iteracion mt-2"></div>
          </div>
          <hr class="mt-4 opacity-10">
        </div>

        <!-- Personas -->
        <div class="col-12">
          <div class="exercise-row">
            <h3 class="h5 fw-bold text-warning">Personas</h3>
            <div id="personas" class="array-text"></div>
            <button id="btnPersonas" class="btn btn-warning w-100 mt-2">
              Doble click: Mostrar
            </button>
            <div id="resPersonas" class="resultado-iteracion mt-2"></div>
          </div>
        </div>

      </div>
    </div>

    <div class="card-footer text-center text-muted small">
      Iteración de Arrays con forEach()
    </div>
  </div>
</div>

<script src="/scripts/script.js"></script>
</body>
</html>
