<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIA - Decodificador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <main class="app-container">

        <!-- BOTÓN MODO OSCURO -->
        <div class="theme-toggle-container">
            <button id="themeToggle" class="btn btn-dark">
                🌙 Modo oscuro
            </button>
        </div>

        <div class="card shadow-lg main-card">

            <div class="card-header bg-primary text-white text-center">
                <h1 class="h4 mb-0">
                    DECODIFICADOR SECRETO OIA
                </h1>
            </div>

            <div class="card-body">

                <div class="row g-4 h-100">

                    <!-- INPUT -->
                    <div class="col-lg-6 d-flex flex-column">

                        <label for="inputTexto" class="form-label fw-bold">
                            Mensaje Codificado:
                        </label>

                        <textarea
                            id="inputTexto"
                            class="form-control flex-grow-1"
                            placeholder="Ej: Hoy (.sh 22 sal a) Marcelo."
                        ></textarea>

                        <button
                            id="btnDescifrar"
                            class="btn btn-primary btn-lg w-100 mt-3 fw-bold"
                        >
                            DESCIFRAR
                        </button>

                    </div>

                    <!-- RESULTADO -->
                    <div class="col-lg-6 d-flex flex-column">

                        <label class="form-label fw-bold result-label">
                            Mensaje Decodificado:
                        </label>

                        <div id="resultado" class="form-control flex-grow-1">
                            <span class="placeholder-result">
                                El resultado aparecerá aquí...
                            </span>
                        </div>

                    </div>

                </div>

            </div>

            <div id="errorContainer" class="px-4 pb-3 d-none">
                <div class="alert alert-danger m-0" id="errorMsg"></div>
            </div>

            <div class="card-footer text-center small">
                Certamen Nacional OIA
            </div>

        </div>

    </main>

    <script src="../scripts/script.js"></script>

</body>
</html>
