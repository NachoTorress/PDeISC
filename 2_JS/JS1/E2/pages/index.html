<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Dual Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header class="main-header shadow-sm mb-4">
    <nav class="container d-flex justify-content-between align-items-center py-3">
        <div class="d-flex align-items-center">
            <span class="fs-4 me-2">⚡</span>
            <h1 class="h4 fw-bold mb-0 text-white">Dual Storage System</h1>
        </div>
        <div id="userBadge" class="badge-count">0 Usuarios</div>
    </nav>
</header>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="glass-card p-4">
                <h5 class="fw-bold mb-4 text-primary">Información Personal</h5>
                <div id="alertContainer"></div>
                
                <form id="userForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="label-custom">Nombre *</label>
                            <input type="text" id="nombre" name="nombre" class="input-custom validate-text" placeholder="Nombre">
                            <div class="error-msg" id="error-nombre">Solo letras, min. 3 carac.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="label-custom">Apellidos *</label>
                            <input type="text" id="apellidos" name="apellidos" class="input-custom validate-text" placeholder="Apellidos">
                            <div class="error-msg" id="error-apellidos">Solo letras, min. 3 carac.</div>
                        </div>
                        
                        <div class="col-md-8">
                            <label class="label-custom">Calle *</label>
                            <input type="text" id="calle" name="calle" class="input-custom validate-text" placeholder="Calle">
                            <div class="error-msg" id="error-calle">Solo letras, min. 3 carac.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="label-custom">Altura *</label>
                            <input type="number" id="altura" name="altura" class="input-custom input-no-e" placeholder="1234">
                        </div>

                        <div class="col-md-6">
                            <label class="label-custom">Piso</label>
                            <input type="text" name="piso" class="input-custom" placeholder="Ej: 4">
                        </div>
                        <div class="col-md-6">
                            <label class="label-custom">Depto</label>
                            <input type="text" name="depto" class="input-custom" placeholder="Ej: B">
                        </div>

                        <div class="col-md-8">
                            <label class="label-custom">Ciudad *</label>
                            <input type="text" id="ciudad" name="ciudad" class="input-custom validate-text" placeholder="Ciudad">
                            <div class="error-msg" id="error-ciudad">Solo letras, min. 3 carac.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="label-custom">Cód. Postal *</label>
                            <input type="number" id="cp" name="cp" class="input-custom input-no-e" placeholder="7600">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary-custom mt-4">GUARDAR REGISTRO</button>
                </form>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="glass-card p-4 h-100">
                <h5 class="fw-bold mb-4 text-primary">Usuarios Guardados</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Usuario</th>
                                <th>Domicilio</th>
                                <th>Ciudad</th>
                                <th class="text-end">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../scripts/main.js"></script>
</body>
</html>
