<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E2 — POST Formulario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link id="theme-stylesheet" rel="stylesheet" href="/styles/dark.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top" id="mainNav">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <span class="brand-icon"><i class="bi bi-upload"></i></span>
          <span class="brand-text">E2 — <span class="brand-accent">POST Formulario</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <a href="http://localhost:3001" class="nav-link">E1</a>
          <a href="http://localhost:3003" class="nav-link">E3</a>
          <a href="http://localhost:3004" class="nav-link">E4</a>
          <button class="btn btn-theme-toggle ms-2" id="themeToggle" aria-label="Cambiar tema">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="hero-section">
      <div class="container-fluid px-4">
        <div class="hero-content">
          <div class="hero-badge"><span class="badge-dot"></span><span>Ejercicio 2</span></div>
          <h1 class="hero-title">POST <span class="hero-fetch">Formulario</span></h1>
          <p class="hero-subtitle">
            Envía nombre y email a <code>jsonplaceholder.typicode.com/posts</code> y muestra el ID de respuesta.
          </p>
        </div>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="main-content">
      <div class="container-fluid px-4">
        <div class="dual-panel">
          <!-- FETCH -->
          <div class="impl-card impl-fetch">
            <div class="impl-header">
              <span class="impl-badge fetch-badge"><i class="bi bi-lightning-fill"></i> Fetch</span>
            </div>
            <div class="form-group-custom">
              <div class="field-wrap">
                <label for="ex2f-nombre">Nombre</label>
                <input type="text" id="ex2f-nombre" class="custom-input" required minlength="2" autocomplete="off" />
                <span class="field-error" id="ex2f-nombre-err"></span>
              </div>
              <div class="field-wrap">
                <label for="ex2f-email">Email</label>
                <input type="email" id="ex2f-email" class="custom-input" required autocomplete="off" />
                <span class="field-error" id="ex2f-email-err"></span>
              </div>
              <button class="btn-run w-100" id="ex2-fetch-btn">
                <i class="bi bi-send-fill"></i> Enviar con Fetch
              </button>
            </div>
            <div class="terminal mt-3" id="ex2-fetch-output">
              <span class="terminal-placeholder">// El ID de respuesta aparecerá aquí...</span>
            </div>
          </div>
          <!-- AXIOS -->
          <div class="impl-card impl-axios">
            <div class="impl-header">
              <span class="impl-badge axios-badge"><i class="bi bi-box-fill"></i> Axios</span>
            </div>
            <div class="form-group-custom">
              <div class="field-wrap">
                <label for="ex2a-nombre">Nombre</label>
                <input type="text" id="ex2a-nombre" class="custom-input" required minlength="2" autocomplete="off" />
                <span class="field-error" id="ex2a-nombre-err"></span>
              </div>
              <div class="field-wrap">
                <label for="ex2a-email">Email</label>
                <input type="email" id="ex2a-email" class="custom-input" required autocomplete="off" />
                <span class="field-error" id="ex2a-email-err"></span>
              </div>
              <button class="btn-run w-100" id="ex2-axios-btn">
                <i class="bi bi-send-fill"></i> Enviar con Axios
              </button>
            </div>
            <div class="terminal mt-3" id="ex2-axios-output">
              <span class="terminal-placeholder">// El ID de respuesta aparecerá aquí...</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Volver arriba">
      <i class="bi bi-arrow-up-short"></i>
    </button>
    <div class="toast-container">
      <div id="appToast" class="app-toast" role="status" aria-live="polite">
        <span id="toastMsg"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
