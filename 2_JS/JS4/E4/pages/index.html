<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E4 — API Propia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link id="theme-stylesheet" rel="stylesheet" href="/styles/dark.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top" id="mainNav">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <span class="brand-icon"><i class="bi bi-database"></i></span>
          <span class="brand-text">E4 — <span class="brand-accent">API Propia</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <a href="http://localhost:3001" class="nav-link">E1</a>
          <a href="http://localhost:3002" class="nav-link">E2</a>
          <a href="http://localhost:3003" class="nav-link">E3</a>
          <button class="btn btn-theme-toggle ms-2" id="themeToggle" aria-label="Cambiar tema">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="hero-section">
      <div class="container-fluid px-4">
        <div class="hero-content">
          <div class="hero-badge"><span class="badge-dot"></span><span>Ejercicio 4</span></div>
          <h1 class="hero-title">API <span class="hero-fetch">Propia</span></h1>
          <p class="hero-subtitle">
            CRUD completo contra la API local <code>/api/alumnos</code> en Node.js. Agregá, editá y eliminá alumnos.
          </p>
        </div>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="main-content">
      <div class="container-fluid px-4">

        <!-- Formulario agregar -->
        <div class="add-form-wrapper">
          <h3 class="sub-section-title"><i class="bi bi-plus-circle"></i> Agregar alumno</h3>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <div class="field-wrap">
                <label for="al-nombre">Nombre</label>
                <input type="text" id="al-nombre" class="custom-input" required minlength="2" autocomplete="off" />
                <span class="field-error" id="al-nombre-err"></span>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="field-wrap">
                <label for="al-email">Email</label>
                <input type="email" id="al-email" class="custom-input" required autocomplete="off" />
                <span class="field-error" id="al-email-err"></span>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="field-wrap">
                <label for="al-materia">Materia</label>
                <input type="text" id="al-materia" class="custom-input" required minlength="2" autocomplete="off" />
                <span class="field-error" id="al-materia-err"></span>
              </div>
            </div>
          </div>
          <div class="add-buttons mt-3 d-flex gap-3 flex-wrap">
            <button class="btn-run" id="al-fetch-add">
              <i class="bi bi-lightning-fill"></i> Agregar con Fetch
            </button>
            <button class="btn-run btn-run-axios" id="al-axios-add">
              <i class="bi bi-box-fill"></i> Agregar con Axios
            </button>
          </div>
        </div>

        <div class="dual-panel mt-4">
          <!-- FETCH -->
          <div class="impl-card impl-fetch">
            <div class="impl-header">
              <span class="impl-badge fetch-badge"><i class="bi bi-lightning-fill"></i> Fetch</span>
              <button class="btn-run btn-sm-run" id="al-fetch-load">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
              </button>
            </div>
            <div id="al-fetch-list" class="alumnos-list">
              <span class="terminal-placeholder">// Cargando...</span>
            </div>
          </div>
          <!-- AXIOS -->
          <div class="impl-card impl-axios">
            <div class="impl-header">
              <span class="impl-badge axios-badge"><i class="bi bi-box-fill"></i> Axios</span>
              <button class="btn-run btn-sm-run" id="al-axios-load">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
              </button>
            </div>
            <div id="al-axios-list" class="alumnos-list">
              <span class="terminal-placeholder">// Cargando...</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal editar -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">
              <i class="bi bi-pencil-fill me-2"></i>Editar alumno
            </h5>
            <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Cerrar">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-id" />
            <input type="hidden" id="edit-method" />
            <div class="field-wrap">
              <label for="edit-nombre">Nombre</label>
              <input type="text" id="edit-nombre" class="custom-input" required minlength="2" />
              <span class="field-error" id="edit-nombre-err"></span>
            </div>
            <div class="field-wrap mt-3">
              <label for="edit-email">Email</label>
              <input type="email" id="edit-email" class="custom-input" required />
              <span class="field-error" id="edit-email-err"></span>
            </div>
            <div class="field-wrap mt-3">
              <label for="edit-materia">Materia</label>
              <input type="text" id="edit-materia" class="custom-input" required minlength="2" />
              <span class="field-error" id="edit-materia-err"></span>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary-custom" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn-run" id="edit-save-btn">
              <i class="bi bi-floppy-fill"></i> Guardar cambios
            </button>
          </div>
        </div>
      </div>
    </div>

    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Volver arriba">
      <i class="bi bi-arrow-up-short"></i>
    </button>
    <div class="toast-container">
      <div id="appToast" class="app-toast" role="status" aria-live="polite">
        <span id="toastMsg"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
