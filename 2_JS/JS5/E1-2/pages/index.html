<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alumnosDB · Gestión de alumnos</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Tema: se alterna entre light.css y dark.css desde main.js -->
  <link id="theme-link" rel="stylesheet" href="/styles/light.css">
</head>
<body>

  <!-- Barra superior -->
  <nav class="navbar navbar-expand px-3 px-md-4 topbar">
    <span class="navbar-brand fw-semibold mb-0">alumnosDB</span>
    <button id="theme-toggle" class="btn btn-sm ms-auto btn-theme" type="button" aria-label="Cambiar tema">
      <span id="theme-icon">🌙</span>
    </button>
  </nav>

  <main class="container-fluid px-3 px-md-5 py-4">

    <!-- Formulario de carga -->
    <section class="card form-card mb-4">
      <div class="card-body">
        <h1 class="h4 mb-3">Cargar alumno</h1>
        <form id="form-alumno" novalidate>
          <div class="row g-3">

            <div class="col-12 col-md-4">
              <label for="input-nombre" class="form-label">Nombre</label>
              <input type="text" id="input-nombre" name="nombre" class="form-control" maxlength="100" required>
              <div class="invalid-feedback" id="error-nombre"></div>
            </div>

            <div class="col-12 col-md-4">
              <label for="input-apellido" class="form-label">Apellido</label>
              <input type="text" id="input-apellido" name="apellido" class="form-control" maxlength="100" required>
              <div class="invalid-feedback" id="error-apellido"></div>
            </div>

            <div class="col-12 col-md-4">
              <label for="input-edad" class="form-label">Edad</label>
              <input type="number" id="input-edad" name="edad" class="form-control" min="0" max="120" required>
              <div class="invalid-feedback" id="error-edad"></div>
            </div>

          </div>

          <div class="d-flex justify-content-end mt-3">
            <button type="submit" id="btn-guardar" class="btn btn-primary" disabled>Guardar alumno</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Listado -->
    <section>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Alumnos cargados</h2>
        <span id="contador-alumnos" class="badge contador-badge">0</span>
      </div>
      <div id="lista-alumnos" class="row g-3"></div>
      <p id="mensaje-vacio" class="text-center text-muted mt-4 d-none">Todavía no hay alumnos cargados.</p>
    </section>

  </main>

  <!-- Contenedor de notificaciones (reemplaza a alert) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Botón subir arriba -->
  <button id="btn-scroll-top" class="btn-scroll-top d-none" aria-label="Subir arriba">↑</button>

  <script src="/scripts/main.js" type="module"></script>
</body>
</html>
