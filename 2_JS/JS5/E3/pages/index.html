<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alumnosDB · Consulta de alumnos</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link id="theme-link" rel="stylesheet" href="/styles/light.css">
</head>
<body>

  <nav class="navbar navbar-expand px-3 px-md-4 topbar">
    <span class="navbar-brand fw-semibold mb-0">alumnosDB · Consulta</span>
    <button id="theme-toggle" class="btn btn-sm ms-auto btn-theme" type="button" aria-label="Cambiar tema">
      <span id="theme-icon">🌙</span>
    </button>
  </nav>

  <main class="container-fluid px-3 px-md-5 py-4">

    <div class="row g-3 align-items-center mb-4">
      <div class="col-12 col-md-6">
        <label for="input-busqueda" class="form-label">Buscar por nombre o apellido</label>
        <input type="text" id="input-busqueda" class="form-control" autocomplete="off">
      </div>
      <div class="col-12 col-md-6 d-flex align-items-end justify-content-md-end">
        <span id="contador-alumnos" class="badge contador-badge">0 alumnos</span>
      </div>
    </div>

    <div id="lista-alumnos" class="row g-3"></div>
    <p id="mensaje-vacio" class="text-center text-muted mt-4 d-none">No se encontraron alumnos.</p>
    <p id="mensaje-error" class="text-center text-muted mt-4 d-none">
      No se pudo conectar con la API de alumnos. Verificá que alumnos-api esté corriendo.
    </p>

  </main>

  <div id="toast-container" class="toast-container"></div>

  <button id="btn-scroll-top" class="btn-scroll-top d-none" aria-label="Subir arriba">↑</button>

  <script src="/scripts/main.js" type="module"></script>
</body>
</html>
