<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Ahorcado</title>

    <!-- Bootstrap 5 (CSS) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Temas (siempre se cargan los dos, el atributo data-theme del html decide cual aplica) -->
    <link rel="stylesheet" href="/styles/light.css" />
    <link rel="stylesheet" href="/styles/dark.css" />
    <!-- Estructura y componentes -->
    <link rel="stylesheet" href="/styles/base.css" />
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-expand-lg navbar-app sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">🪢 El Ahorcado</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" href="#area-juego-seccion">Jugar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#posiciones-seccion">Tabla de posiciones</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-moon-stars-fill" id="icono-tema"></i>
                    <div class="form-check form-switch mb-0">
                        <input
                            class="form-check-input form-check-input-tema"
                            type="checkbox"
                            id="switch-tema"
                            role="switch"
                        />
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <div class="contenedor-app">

        <section id="area-juego-seccion" class="grid-juego">

            <!-- ---------- Panel del juego ---------- -->
            <div class="panel">
                <h2 class="text-center mb-3">Adivina la palabra</h2>

                <div id="cargando-palabra" class="contenedor-carga">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Buscando una palabra...</p>
                </div>

                <div id="area-juego" class="d-none">
                    <div class="info-palabra">
                        <span id="categoria-palabra" class="badge-categoria"></span>
                        <p id="pista-palabra" class="texto-pista"></p>
                    </div>

                    <div class="text-center mb-3">
                        <button type="button" id="btn-jugar-de-nuevo" class="btn btn-app btn-secundario d-none">
                            <i class="bi bi-arrow-repeat"></i> Jugar de nuevo
                        </button>
                    </div>

                    <div class="contenedor-dibujo">
                        <div id="dibujo-ahorcado"></div>
                    </div>

                    <div class="info-partida">
                        <div class="dato">
                            <span class="valor" id="intentos-restantes">6</span>
                            <span class="etiqueta">Intentos</span>
                        </div>
                        <div class="dato">
                            <span class="valor" id="cronometro">00:00</span>
                            <span class="etiqueta">Tiempo</span>
                        </div>
                    </div>

                    <p id="palabra-oculta" class="palabra-oculta"></p>

                    <div id="mensaje-final" class="d-none"></div>

                    <div id="teclado" class="teclado"></div>
                </div>
            </div>

            <!-- ---------- Panel de resultado / guardar puntaje + Top 3 ---------- -->
            <div class="d-flex flex-column gap-3">
                <div class="panel">
                    <h3 class="mb-3"><i class="bi bi-trophy-fill"></i> Tu resultado</h3>

                    <div id="panel-resultado" class="d-none">
                        <div class="resumen-resultado">
                            <div class="dato">
                                <span class="valor" id="resumen-puntos">0</span>
                                <span class="etiqueta">Puntos</span>
                            </div>
                            <div class="dato">
                                <span class="valor" id="resumen-tiempo">00:00</span>
                                <span class="etiqueta">Tiempo</span>
                            </div>
                        </div>

                        <form id="form-guardar-puntaje" novalidate>
                            <label for="input-nombre-jugador" class="label-formulario">
                                ¿Con que nombre queres guardar tu puntaje?
                            </label>
                            <input
                                type="text"
                                id="input-nombre-jugador"
                                class="form-control"
                                autocomplete="off"
                            />
                            <div id="error-nombre-jugador" class="mensaje-error"></div>

                            <button type="submit" id="btn-guardar-puntaje" class="btn btn-app btn-primario mt-2">
                                <i class="bi bi-save-fill"></i> Guardar puntaje
                            </button>
                        </form>

                        <button type="button" id="btn-descargar-pdf" class="btn btn-app btn-exito mt-2 d-none">
                            <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
                        </button>
                    </div>

                    <p id="texto-sin-resultado" class="texto-vacio">
                        Termina una partida para ver tu resultado aca.
                    </p>
                </div>

                <div class="panel">
                    <h3 class="mb-3"><i class="bi bi-award-fill"></i> Top 3</h3>
                    <div id="lista-top3" class="lista-top3"></div>
                </div>
            </div>
        </section>

        <hr class="separador" />

        <!-- ---------- Tabla de posiciones ---------- -->
        <section id="posiciones-seccion">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="mb-0"><i class="bi bi-list-ol"></i> Tabla de posiciones</h2>
                <button type="button" id="btn-descargar-tabla-pdf" class="btn btn-app btn-secundario">
                    <i class="bi bi-file-earmark-pdf-fill"></i> Descargar tabla (PDF)
                </button>
            </div>
            <div id="lista-posiciones" class="lista-posiciones"></div>
        </section>
    </div>

    <!-- Boton flotante "subir arriba" -->
    <button type="button" id="btn-subir-arriba" title="Subir arriba">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Bootstrap Bundle (JS, incluye Popper para el navbar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script principal de la app (ES Modules) -->
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
