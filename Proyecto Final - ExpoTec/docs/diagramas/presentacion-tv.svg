l(#arrow)" stroke-dasharray="none" data-edge="t-e9" /><polyline points="825,680 825,760" fill="none" stroke="#52616b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="none" data-edge="t-e10" /><polyline points="950,625 1030,625" fill="none" stroke="#52616b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="none" data-edge="t-e11" /><polyline points="1155,570 1155,520 320,520 320,330 495,330 495,370" fill="none" stroke="#52616b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="none" data-edge="t-e12" /><polyline points="825,860 825,870 1360,870 1360,510 990,510 990,425 950,425" fill="none" stroke="#52616b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="none" data-edge="t-e13" /><g data-node="presentation-title"><text x="42.0" y="64.25" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="start" font-weight="700">04 · Cómo funciona la presentación TV</text></g><g data-node="presentation-subtitle"><text x="42.0" y="122.375" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="400">Acceso público, inicio manual, video sin sonido por defecto y controles de pausa, avance, retroceso y pantalla completa.</text></g><g data-node="t-approved"><rect x="40.0" y="170.0" width="250.0" height="100.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="none" /><text x="165.0" y="206.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Proyectos confirmados</text><text x="165.0" y="226.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Con puesto asignado</text><text x="165.0" y="246.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">y espacio activo</text></g><g data-node="t-feed"><rect x="370.0" y="170.0" width="250.0" height="100.0" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="none" /><text x="495.0" y="196.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Consulta pública</text><text x="495.0" y="216.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Solo campos publicados</text><text x="495.0" y="236.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Sin correos ni datos de</text><text x="495.0" y="256.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">préstamos</text></g><g data-node="t-pages"><rect x="700.0" y="170.0" width="250.0" height="100.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="825.0" y="196.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Cargar la secuencia</text><text x="825.0" y="216.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Páginas de hasta 100</text><text x="825.0" y="236.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Reemplazar solo al terminar</text><text x="825.0" y="256.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">la carga completa</text></g><g data-node="t-ready"><rect x="1030.0" y="170.0" width="250.0" height="100.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="1155.0" y="206.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Muestra lista, pausada</text><text x="1155.0" y="226.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Conserva el proyecto actual</text><text x="1155.0" y="246.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">si sigue confirmado</text></g><g data-node="t-start"><rect x="1030.0" y="370.0" width="250.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="1155.0" y="411.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Iniciar presentación</text><text x="1155.0" y="431.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Inicio manual</text><text x="1155.0" y="451.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Sonido opcional</text></g><g data-node="t-video"><polygon points="825.0,370.0 950.0,425.0 825.0,480.0 700.0,425.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" /><text x="825.0" y="421.25" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="400">¿Tiene video</text><text x="825.0" y="440.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="400">disponible?</text></g><g data-node="t-card"><rect x="370.0" y="370.0" width="250.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="495.0" y="391.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Mostrar ficha</text><text x="495.0" y="411.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Imagen, descripción y</text><text x="495.0" y="431.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">equipo</text><text x="495.0" y="451.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Profesores y materias</text><text x="495.0" y="471.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Aula y puesto</text></g><g data-node="t-timer"><rect x="370.0" y="570.0" width="250.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="495.0" y="611.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Avanzar la ficha</text><text x="495.0" y="631.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Tras 8, 15 o 30 segundos</text><text x="495.0" y="651.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Solo mientras está en curso</text></g><g data-node="t-play"><rect x="700.0" y="570.0" width="250.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="825.0" y="601.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Reproducir video</text><text x="825.0" y="621.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Avanzar al terminar</text><text x="825.0" y="641.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Pausar al salir u ocultar</text><text x="825.0" y="661.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">TV</text></g><g data-node="t-fail"><rect x="1030.0" y="570.0" width="250.0" height="110.0" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="none" /><text x="1155.0" y="601.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Video no disponible</text><text x="1155.0" y="621.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Error o 30 s sin avance:</text><text x="1155.0" y="641.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">mostrar ficha y ofrecer</text><text x="1155.0" y="661.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">reintento</text></g><g data-node="t-next"><rect x="700.0" y="760.0" width="250.0" height="100.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="none" /><text x="825.0" y="796.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Siguiente proyecto</text><text x="825.0" y="816.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Al terminar la secuencia,</text><text x="825.0" y="836.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">volver al primero</text></g><g data-node="t-refresh"><rect x="40.0" y="760.0" width="560.0" height="100.0" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="none" /><text x="320.0" y="796.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Actualizar cada minuto</text><text x="320.0" y="816.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Reabiertos y cancelados salen</text><text x="320.0" y="836.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">de la secuencia</text></g><g data-node="t-offline"><rect x="1030.0" y="760.0" width="250.0" height="100.0" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="none" /><text x="1155.0" y="796.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Sin conexión</text><text x="1155.0" y="816.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Pausar y ocultar secuencia</text><text x="1155.0" y="836.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Actualizar y reiniciar</text></g><g data-node="t-footnote"><text x="42.0" y="903.625" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="400">La pausa no cambia de proyecto. Una actualización fallida detiene la reproducción. La ficha completa se puede abrir para leer más.</text></g><g data-node="t-legend-success"><rect x="40.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="none" /><text x="127.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Datos / resultado</text></g><g data-node="t-legend-accent"><rect x="230.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="none" /><text x="317.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Servidor</text></g><g data-node="t-legend-primary"><rect x="420.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="507.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Proceso / interfaz</text></g><g data-node="t-legend-warning"><rect x="610.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" stroke-dasharray="none" /><text x="697.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Comprobación</text></g><g data-node="t-legend-danger"><rect x="800.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="none" /><text x="887.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Conflicto / fallo</text></g><g data-node="t-source"><text x="42.0" y="1017.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="400">Fuentes del repositorio: SharedPresentationPage.tsx · SharedPresentationVideo.web.tsx · sharedPresentation.ts · projects.mjs</text></g><rect x="1084.1" y="308.0" width="141.8" height="24" rx="3" fill="#fff" /><text x="1155.0" y="325.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e4">Acción del usuario</text><rect x="947.5" y="413.0" width="85.0" height="24" rx="3" fill="#fff" /><text x="990.0" y="430.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e5">Al iniciar</text><rect x="645.9" y="413.0" width="28.2" height="24" rx="3" fill="#fff" /><text x="660.0" y="430.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e6">No</text><rect x="810.9" y="513.0" width="28.2" height="24" rx="3" fill="#fff" /><text x="825.0" y="530.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e7">Sí</text><rect x="517.25" y="703.0" width="120.5" height="24" rx="3" fill="#fff" /><text x="577.5" y="720.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e9">Tiempo cumplido</text><rect x="764.75" y="708.0" width="120.5" height="24" rx="3" fill="#fff" /><text x="825.0" y="725.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e10">Video terminado</text><rect x="954.6" y="613.0" width="70.8" height="24" rx="3" fill="#fff" /><text x="990.0" y="630.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e11">Si falla</text><rect x="695.0" y="508.0" width="85.0" height="24" rx="3" fill="#fff" /><text x="737.5" y="525.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e12">Usar ficha</text><rect x="1018.05" y="858.0" width="148.9" height="24" rx="3" fill="#fff" /><text x="1092.5" y="875.0" fill="#33434c" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" data-edge-label="t-e13">En curso: continuar</text></svg>