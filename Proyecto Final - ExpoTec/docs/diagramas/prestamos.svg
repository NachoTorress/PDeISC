t="700">Fuera de servicio</text><text x="495.0" y="621.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Cuenta como unidad devuelta</text><text x="495.0" y="641.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Daño con motivo e historial</text></g><g data-node="l-repair"><rect x="40.0" y="560.0" width="250.0" height="110.0" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="none" /><text x="165.0" y="601.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Administración</text><text x="165.0" y="621.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Revisa o repara y ajusta</text><text x="165.0" y="641.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">el estado con un motivo</text></g><g data-node="l-balance"><polygon points="825.0,750.0 950.0,805.0 825.0,860.0 700.0,805.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" /><text x="825.0" y="801.25" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="400">¿Saldo del</text><text x="825.0" y="820.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="400">préstamo en 0?</text></g><g data-node="l-closed"><rect x="1060.0" y="750.0" width="250.0" height="110.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="none" /><text x="1185.0" y="791.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Préstamo devuelto</text><text x="1185.0" y="811.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Conserva su reserva</text><text x="1185.0" y="831.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">para la jornada siguiente</text></g><g data-node="l-footnote"><text x="42.0" y="903.625" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="400">No se reabre ni cancela un proyecto con pendientes. No se da de baja un elemento prestado. Devolución y daños se guardan juntos.</text></g><g data-node="l-legend-success"><rect x="40.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="none" /><text x="127.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Datos / resultado</text></g><g data-node="l-legend-primary"><rect x="230.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="317.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Proceso / interfaz</text></g><g data-node="l-legend-warning"><rect x="420.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" stroke-dasharray="none" /><text x="507.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Comprobación</text></g><g data-node="l-legend-danger"><rect x="610.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="none" /><text x="697.5" y="960.875" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="400">Conflicto / fallo</text></g><g data-node="l-legend-secondary"><rect x="800.0" y="940.0" width="175.0" height="32.0" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="none" />