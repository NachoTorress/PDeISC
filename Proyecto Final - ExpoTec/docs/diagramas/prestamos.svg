="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">de elementos</text></g><g data-node="l-deliver"><rect x="370.0" y="170.0" width="250.0" height="100.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="495.0" y="186.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Préstamos / administración</text><text x="495.0" y="206.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Elige jornada y cantidad</text><text x="495.0" y="226.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Elemento reservado</text><text x="495.0" y="246.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Integrante activo que</text><text x="495.0" y="266.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">retira</text></g><g data-node="l-check"><polygon points="825.0,160.0 950.0,220.0 825.0,280.0 700.0,220.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" /><text x="825.0" y="216.25" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="400">¿Reserva y stock?</text><text x="825.0" y="235.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="400">¿Entrega única?</text></g><g data-node="l-open"><rect x="1060.0" y="170.0" width="250.0" height="100.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="none" /><text x="1185.0" y="196.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Entrega registrada</text><text x="1185.0" y="216.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Proyecto y receptor</text><text x="1185.0" y="236.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Operador, jornada y fecha</text><text x="1185.0" y="256.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Cantidades entregadas</text></g><g data-node="l-reject"><rect x="700.0" y="370.0" width="250.0" height="100.0" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="none" /><text x="825.0" y="406.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Rechazo de la entrega</text><text x="825.0" y="426.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">No modifica préstamos</text><text x="825.0" y="446.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">ni existencias</text></g><g data-node="l-note"><rect x="370.0" y="370.0" width="250.0" height="100.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="495.0" y="406.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Registrar novedad</text><text x="495.0" y="426.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">Cantidad 0 + explicación</text><text x="495.0" y="446.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400">No devuelve unidades</text></g><g data-node="l-pending"><rect x="1060.0" y="370.0" width="250.0" height="100.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="none" /><text x="1185.0" y="406.0" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-